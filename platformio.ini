; BrewPass - RFID based coin validator emulator (replacing an NRI G-13) for a Saeco Royal Office machine
;
; Environments:
;   target  - target hardware: ESP32 (WROOM-32) + RC522 (SPI) + SH1106 OLED (I2C) + buzzer
;   tembed  - test hardware: LilyGO T-Embed CC1101 Plus (ESP32-S3, PN532 I2C, ST7789 TFT)
;   native  - unit tests of the hardware independent logic (lib/VendCore) on the PC: pio test -e native

[platformio]
default_envs = target, tembed
boards_dir = boards

[esp32_common]
platform = espressif32@6.11.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DENABLE_USER_AUTH
    -DENABLE_DATABASE
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    mobizt/FirebaseClient@^2.2.13
    bblanchon/ArduinoJson@^7.4.2

[env:target]
extends = esp32_common
board = esp32dev
; 1.9 MB application + OTA space (the default 1.3 MB was already 80%+ full)
board_build.partitions = min_spiffs.csv
build_flags =
    ${esp32_common.build_flags}
    -DBOARD_TARGET
build_src_filter = +<*> -<hal/tembed/>
lib_deps =
    ${esp32_common.lib_deps}
    miguelbalboa/MFRC522@^1.4.11
    olikraus/U8g2@^2.36.2

[env:tembed]
extends = esp32_common
board = lilygo_t_embed_cc1101
build_flags =
    ${esp32_common.build_flags}
    -DBOARD_TEMBED
    -DDISABLE_ALL_LIBRARY_WARNINGS
    ; TFT_eSPI setup (based on LilyGO Setup214), so the library itself needs no modification
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_INVERSION_ON=1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_MISO=10
    -DTFT_MOSI=9
    -DTFT_SCLK=11
    -DTFT_CS=41
    -DTFT_DC=16
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
build_src_filter = +<*> -<hal/target/>
lib_deps =
    ${esp32_common.lib_deps}
    adafruit/Adafruit PN532@^1.3.4
    adafruit/Adafruit NeoPixel@^1.12.3
    lewisxhe/XPowersLib@^0.3.3
    bodmer/TFT_eSPI@^2.5.43
    ; brings its own copy of the U8g2 fonts, so olikraus/U8g2 must NOT be listed here (duplicate symbols)
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git

[env:native]
platform = native
build_flags = -std=c++17 -Wall -DVENDCORE_NATIVE
test_build_src = no
lib_compat_mode = off

; ---------------------------------------------------------------- OTA upload (over WiFi)
; Usage (the password is the OTA_PASSWORD value from secrets.h):
;   export RFID_OTA_PASSWORD='...'
;   pio run -e tembed_ota -t upload                          (mDNS: brewpass.local)
;   pio run -e tembed_ota -t upload --upload-port 10.0.0.42  (or by IP address)
; An update only starts in an idle state (the device does not answer during a purchase).
[ota_common]
upload_protocol = espota
upload_port = brewpass.local
upload_flags =
    --port=3232
    --auth=${sysenv.RFID_OTA_PASSWORD}
    --timeout=30

[env:target_ota]
extends = env:target
upload_protocol = ${ota_common.upload_protocol}
upload_port = ${ota_common.upload_port}
upload_flags = ${ota_common.upload_flags}

[env:tembed_ota]
extends = env:tembed
upload_protocol = ${ota_common.upload_protocol}
upload_port = ${ota_common.upload_port}
upload_flags = ${ota_common.upload_flags}
